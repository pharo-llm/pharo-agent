name: Upload GGUF Model

on:
  workflow_dispatch:
    inputs:
      gguf_url:
        description: HTTPS URL for the GGUF file to upload
        required: true
      repo:
        description: Hugging Face model repo
        required: true
        default: pharo-llm/pharo-agent
      path_in_repo:
        description: Optional target filename/path inside the model repo
        required: false
      create_pr:
        description: Upload as a pull request
        required: false
        default: 'false'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade 'huggingface_hub[cli]'
      - name: Download GGUF
        run: curl --fail --location "${{ inputs.gguf_url }}" --output model.gguf
      - name: Upload model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing HF_TOKEN secret" >&2
            exit 1
          fi
          path_in_repo="${{ inputs.path_in_repo }}"
          if [ -z "$path_in_repo" ]; then
            path_in_repo="$(basename "${{ inputs.gguf_url }}")"
          fi
          args=(upload "${{ inputs.repo }}" model.gguf "$path_in_repo" --repo-type model --commit-message "Upload Pharo Agent GGUF")
          if [ "${{ inputs.create_pr }}" = "true" ]; then
            args+=(--create-pr)
          fi
          hf "${args[@]}" --token "$HF_TOKEN"
